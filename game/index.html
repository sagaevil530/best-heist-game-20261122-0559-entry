<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Halcyon Heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070912;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    background: #0b0e1a;
  }
  #selftest {
    position: absolute;
    left: -9999px;
    top: 0;
    white-space: pre;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<div id="selftest"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
